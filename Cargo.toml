[workspace]
members = ["crates/*"]
resolver = "2"

# arbitrum-reth: Arbitrum/ArbOS execution wired into reth. Execution engine lives in the
# separate `arb-revm` repo (no reth deps); this workspace git-depends on it and on arb-alloy.

[workspace.package]
authors = ["nun"]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nuntax/arbitrum-reth"
version = "0.1.0"

[profile.dev]
# https://davidlattimore.github.io/posts/2024/02/04/speeding-up-the-rust-edit-build-run-cycle.html
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Speed up tests.
[profile.dev.package]
proptest.opt-level = 3
rand_chacha.opt-level = 3
rand_xorshift.opt-level = 3
unarray.opt-level = 3

# Meant for testing - all optimizations, but with debug assertions and overflow checks.
[profile.hivetests]
inherits = "test"
opt-level = 3
lto = "thin"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

# Use the `--profile profiling` flag to show symbols in release mode.
# e.g. `cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

# Include debug info in benchmarks too.
[profile.bench]
inherits = "profiling"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

# Big-block build (09-25): release (thin LTO) with a single codegen unit, plus Sapphire Rapids code
# generation (production and the idle box are both r7iz, Xeon Gold 6455B; `target-cpu=native` there
# is exactly `sapphirerapids`). A binary built this way must not run on an older CPU family. Build:
#   RUSTFLAGS="-C target-cpu=sapphirerapids" cargo rustc --profile perf -p arb-reth-node \
#     --bin arb-reth --features jemalloc -- -C link-arg=-Wl,--allow-multiple-definition
# Output: target/perf/arb-reth. With one codegen unit the bin's no-op `__rust_probestack` shim and
# wasmer_vm's own copy both reach the linker (the only duplicate symbol it reports); the link arg,
# given to the final binary only, keeps the first definition (the shim, as in the regular build).
# `maxperf`'s fat LTO still does not link.
[profile.perf]
inherits = "release"
codegen-units = 1

[profile.maxperf-symbols]
inherits = "maxperf"
debug = "full"
strip = "none"

[profile.reproducible]
inherits = "release"
panic = "abort"
codegen-units = 1
incremental = false

[workspace.dependencies]
# Keep the ArbOS implementation revision in one place. Individual crates opt into it with
# `arb-revm.workspace = true`; only the EVM integration enables the Stylus runtime.
arb-revm = { git = "https://github.com/nuntax/arbitrum-revm", rev = "988d146333f31e570a55e96665f0ad13e3d88908" }
# Pinned to revm 42 to unify with arb_revm workspace.
revm = { version = "42.0.1", features = [
    "optional_priority_fee_check",
    "optional_balance_check",
    "optional_no_base_fee",
    "optional_eip7623",
    "optional_eip3541",
] }
alloy-rlp = "0.3.12"
serde_json = "1.0.145"

# 09-25 big-block speedups need three small, behavior-neutral additions to arb-revm: a precomputed
# brotli-length hint for the L1 poster cost (`L1CompressedLen`), `digest_message_with` taking
# already-decoded transactions, and a per-thread switch for the handler timing histograms. They
# live in a local fork checked out next to this repository:
#   ../arbitrum-revm   branch perf/bigblock-0925 = upstream 988d146 (the rev pinned above) + 944c09f
# The pinned `rev` above stays the upstream base. To build elsewhere, copy that directory to the
# same relative path, or push the fork and replace this path with its `git`/`rev`.
[patch."https://github.com/nuntax/arbitrum-revm"]
arb-revm = { path = "../arbitrum-revm/crates/arb-revm" }
